name: broker in a box

on:
  push:
    # branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest,  windows-latest]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - id: pact-broker-cli
        uses: you54f/pact-broker-in-a-box@main
      - name: Check broker
        run: |
          curl localhost:9292