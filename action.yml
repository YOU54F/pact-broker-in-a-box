name: pact-broker
description: A Pact Broker designed to run cross platform in CI/CD pipelines with minimal setup.
runs:
  using: "composite"
  steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      # - run: bundle install
      #   shell: bash
      - name: start broker
        shell: bash
        run: |
          bundle exec puma --pidfile $GITHUB_ACTION_PATH/broker.pid &
          wget -qO- https://raw.githubusercontent.com/eficode/wait-for/v2.2.3/wait-for | sh -s -- 0.0.0.0:9292 -t 120 -- echo broker is up