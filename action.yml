name: pact-broker
description: A Pact Broker designed to run cross platform in CI/CD pipelines with minimal setup.

runs:
  using: "composite"
  steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
        working-directory: ${{ github.action_path }}
      - name: install scoop
        shell: powershell
        if: runner.os == 'windows'
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$HOME\scoop\shims\" >> $env:GITHUB_PATH
      - name: install wget and netcat via scoop
        if: runner.os == 'windows'
        shell: powershell
        run: |
          scoop install wget
          scoop install netcat
      - name: start broker
        shell: bash
        working-directory: ${{ github.action_path }}
        run: |
          bundle exec puma --pidfile broker.pid &
          wget -qO- https://raw.githubusercontent.com/eficode/wait-for/v2.2.3/wait-for | sh -s -- localhost:9292 -t 120 -- echo broker is up